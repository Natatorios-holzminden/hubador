    // Lightbox
    function openLightbox(item) {
      const dData = item.dates[currentDate];
      document.getElementById('lbImg').src = dData.img;
      document.getElementById('lbTitle').textContent = item.name + ' (' + dData.dateLabel + ')';
      document.getElementById('lbPrices').textContent = 'Coto: ' + dData.coto + '  ·  Mercado Central: ' + dData.mc;
      document.getElementById('lbUrl').href = item.url;
      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox(e) {
      if (e && e.target !== document.getElementById('lightbox') && !e.target.classList.contains('lb-close')) return;
      document.getElementById('lightbox').classList.remove('open');
      document.getElementById('lbImg').src = '';
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') { document.getElementById('lightbox').classList.remove('open'); document.body.style.overflow = ''; } });

    function render() {
      const grid = document.getElementById('galleryGrid');
      grid.innerHTML = ITEMS
        .filter(item => currentFilter === 'todos' || item.cat === currentFilter)
        .map(item => {
          const dData = item.dates[currentDate];
          return `
          <div class="card">
            <div class="card-header">
              <div class="card-title">${item.name}</div>
              <span class="rank-badge ${item.cat === 'verduras' ? 'badge-verdura' : 'badge-fruta'}">
                ${item.cat === 'verduras' ? '🥬' : '🍎'} #${item.rank}
              </span>
            </div>
            <div class="card-price-row">
              <div>
                <span class="price-coto"><i class="fa-solid fa-cart-shopping"></i> Coto: ${dData.coto}</span>
                <span style="margin: 0 4px; color:#475569;">|</span>
                <span class="price-mc">Central: ${dData.mc}</span>
              </div>
              <span class="date-indicator"><i class="fa-solid fa-calendar-day"></i> ${dData.dateLabel}</span>
            </div>
            <div class="card-img-container" onclick="openLightbox(ITEMS.find(x=>x.id==='${item.id}'))" title="Click para ver en pantalla completa">
              <img src="${dData.img}" alt="Evidencia ${item.name} (${dData.dateLabel})">
            </div>
            <div class="card-footer">
              <span style="color:#64748b;">📸 Captura ${dData.dateLabel}</span>
              <a href="${item.url}" target="_blank" class="coto-link" onclick="event.stopPropagation()">Ver en Coto Digital <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
            </div>
          </div>
        `;
        }).join('');
    }

    function selectDate(dateKey) {
      currentDate = dateKey;
      document.getElementById('btnDate16').classList.toggle('active', dateKey === '16sep');
      document.getElementById('btnDate17').classList.toggle('active', dateKey === '17sep');
      document.getElementById('btnDate21').classList.toggle('active', dateKey === '21sep');
      document.getElementById('btnDate22').classList.toggle('active', dateKey === '22sep');
      document.getElementById('btnDate23').classList.toggle('active', dateKey === '23sep');
      render();
    }

    function filterGallery(cat, btn) {
      currentFilter = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    render();
  </script>
