    // Lightbox
    function openLightbox(item) {
      const dData = item.dates[currentDate] || item.dates['29sep'] || item.dates['28sep'];
      document.getElementById('lbImg').src = dData.img;
      document.getElementById('lbTitle').textContent = item.name + ' (' + dData.dateLabel + ')';
      document.getElementById('lbPrices').textContent = 'Coto: ' + dData.coto + '  ·  Mercado Central: ' + dData.mc;
      document.getElementById('lbUrl').href = item.url;
      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox(e) {
      if (e && e.target !== document.getElementById('lightbox') && !e.target.classList.contains('lb-close')) return;
      document.getElementById('lightbox').classList.remove('open');
      document.getElementById('lbImg').src = '';
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') { document.getElementById('lightbox').classList.remove('open'); document.body.style.overflow = ''; } });

    function render() {
      const grid = document.getElementById('galleryGrid');
      grid.innerHTML = ITEMS
        .filter(item => {
          if (currentFilter === 'todos') return true;
          if (currentFilter === 'atomic') return !!item.atomic;
          return item.cat === currentFilter;
        })
        .map(item => {
          const dData = item.dates[currentDate] || item.dates['29sep'] || item.dates['28sep'];
          return `
          <div class="card">
            <div class="card-header">
              <div class="card-title">${item.name}</div>
              <div style="display:flex; align-items:center; gap:4px;">
                ${item.atomic ? '<span class="rank-badge badge-atomic" title="Producto Categoría Atomic"><i class="fa-solid fa-atom"></i> Atomic</span>' : ''}
                <span class="rank-badge ${item.cat === 'verduras' ? 'badge-verdura' : 'badge-fruta'}">
                  ${item.cat === 'verduras' ? '🥬' : '🍎'} #${item.rank}
                </span>
              </div>
            </div>
            <div class="card-price-row">
              <div style="display:flex; align-items:center; gap:0.3rem;">
                <span class="price-coto"><i class="fa-solid fa-cart-shopping"></i> Coto: ${dData.coto}</span>
                <button class="edit-btn" onclick="editPrice('${item.id}', 'coto', '${currentDate}')" title="✏️ Editar precio de Coto">✏️</button>
                <span style="margin: 0 4px; color:#475569;">|</span>
                <span class="price-mc">Central: ${dData.mc}</span>
                <button class="edit-btn" onclick="editPrice('${item.id}', 'mc', '${currentDate}')" title="✏️ Editar precio del Mercado Central">✏️</button>
              </div>
              <span class="date-indicator"><i class="fa-solid fa-calendar-day"></i> ${dData.dateLabel}</span>
            </div>
            <div class="card-img-container" onclick="openLightbox(ITEMS.find(x=>x.id==='${item.id}'))" title="Click para ver en pantalla completa">
              <img src="${dData.img}" alt="Evidencia ${item.name} (${dData.dateLabel})">
            </div>
            <div class="card-footer">
              <span style="color:#64748b;">📸 Captura ${dData.dateLabel}</span>
              <a href="${item.url}" target="_blank" class="coto-link" onclick="event.stopPropagation()">Ver en Coto Digital <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
            </div>
          </div>
        `;
        }).join('');
    }

    function selectDate(dateKey) {
      currentDate = dateKey;
      document.getElementById('btnDate16').classList.toggle('active', dateKey === '16sep');
      document.getElementById('btnDate17').classList.toggle('active', dateKey === '17sep');
      document.getElementById('btnDate21').classList.toggle('active', dateKey === '21sep');
      document.getElementById('btnDate22').classList.toggle('active', dateKey === '22sep');
      document.getElementById('btnDate23').classList.toggle('active', dateKey === '23sep');
      document.getElementById('btnDate28').classList.toggle('active', dateKey === '28sep');
      document.getElementById('btnDate1oct').classList.toggle('active', dateKey === '1oct');
      document.getElementById('btnDate29').classList.toggle('active', dateKey === '29sep');
      render();
    }

    function filterGallery(cat, btn) {
      currentFilter = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function editPrice(itemId, storeKey, dateKey) {
      const item = ITEMS.find(x => x.id === itemId);
      if (!item) return;
      const dData = item.dates[dateKey] || item.dates['29sep'];
      const currentVal = storeKey === 'coto' ? dData.coto : dData.mc;
      
      const storeName = storeKey === 'coto' ? 'Coto Digital' : 'Mercado Central';
      const newVal = prompt(`✏️ Editar precio manual de ${item.name} (${storeName} - ${dData.dateLabel}):`, currentVal);
      if (newVal !== null && newVal.trim() !== "") {
        let formattedVal = newVal.trim();
        if (!formattedVal.startsWith('$')) formattedVal = '$' + formattedVal;
        if (storeKey === 'coto') {
          dData.coto = formattedVal;
        } else {
          dData.mc = formattedVal;
        }
        localStorage.setItem(`custom_price_${itemId}_${storeKey}_${dateKey}`, formattedVal);
        render();
      }
    }

    function loadCustomPrices() {
      ITEMS.forEach(item => {
        Object.keys(item.dates).forEach(dKey => {
          const savedCoto = localStorage.getItem(`custom_price_${item.id}_coto_${dKey}`);
          if (savedCoto) item.dates[dKey].coto = savedCoto;
          const savedMc = localStorage.getItem(`custom_price_${item.id}_mc_${dKey}`);
          if (savedMc) item.dates[dKey].mc = savedMc;
        });
      });
    }

    function resetCustomPrices() {
      if (confirm("¿Deseas restablecer todos los precios editados manualmente a sus valores originales de los scrapers?")) {
        Object.keys(localStorage).forEach(key => {
          if (key.startsWith('custom_price_')) localStorage.removeItem(key);
        });
        location.reload();
      }
    }

    loadCustomPrices();
    render();
  </script>
