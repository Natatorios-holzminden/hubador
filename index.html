function App() {
  const [active, setActive] = useState(() => {
    const s = localStorage.getItem('mobileScreen') || 'home';
    // Precios/Comparador y Grupo en vivo (legacy) ocultos en app pública
    if (APP_MODE && s === 'comparador') {
      try { localStorage.setItem('mobileScreen', 'home'); } catch (e) {}
      return 'home';
    }
    if (APP_MODE && s === 'grupo-participantes') {
      try { localStorage.setItem('mobileScreen', 'mis-grupos'); } catch (e) {}
      return 'mis-grupos';
    }
    // Historial vive dentro de Perfil
    if (s === 'historial' || s === 'pedidos') {
      try { localStorage.setItem('mobileScreen', 'perfil'); } catch (e) {}
      return 'perfil';
    }
    return s;
  });
  const [selected, setSelected] = useState(null);
  const [selectedOrder, setSelectedOrder] = useState(null);
  const [selectedGroup, setSelectedGroup] = useState(null);
  const [webSearch, setWebSearch] = useState('');
  const [toast, setToast] = useState(null);
  const [user, setUser] = useState(() => {try {return JSON.parse(localStorage.getItem('conlatUser') || 'null');} catch (e) {return null;}});
  const [cart, setCart] = useState(() => {try {return JSON.parse(localStorage.getItem('conlatCart') || '[]');} catch (e) {return [];}});
  const [orders, setOrders] = useState(() => {
    const list = loadHubadorOrders();
    syncActiveGroupsFromOrders(list);
    return list;
  });
  const [misGruposTab, setMisGruposTab] = useState('carrito');
  const [mpDemoOpen, setMpDemoOpen] = useState(false);
  const [profileGateOpen, setProfileGateOpen] = useState(false);
  const applyUser = (u) => {
    setUser(u);
    try {
      if (u) localStorage.setItem('conlatUser', JSON.stringify(u));
      else localStorage.removeItem('conlatUser');
    } catch (e) {}
  };
  const login = (u) => { applyUser(u); };
  const logout = async () => {
    if (sb) { try { await sb.auth.signOut(); } catch (e) {} }
    applyUser(null);
    try { localStorage.removeItem('conlatCart'); } catch (e) {}
    setCart([]);
  };
  React.useEffect(() => {
    if (!sb) {
      const t = setTimeout(() => {
        try {
          if (!sessionStorage.getItem('hubadorDemoAuthToast')) {
            sessionStorage.setItem('hubadorDemoAuthToast', '1');
            setToast('Modo demo — configurá Supabase');
            setTimeout(() => setToast(null), 2400);
          }
        } catch (e) {
          setToast('Modo demo — configurá Supabase');
          setTimeout(() => setToast(null), 2400);
        }
      }, 700);
      return () => clearTimeout(t);
    }
    let unsub = () => {};
    let alive = true;
    (async () => {
      try {
        const { data: { session } } = await sb.auth.getSession();
        if (alive && session) {
          const u = await resolveUserFromSession(session);
          if (u) applyUser(u);
        }
      } catch (e) { console.warn('[HUBADOR] getSession', e); }
      const { data } = sb.auth.onAuthStateChange(async (event, session) => {
        if (!alive) return;
        if (session) {
          const u = await resolveUserFromSession(session);
          if (u) applyUser(u);
        } else if (event === 'SIGNED_OUT') {
          applyUser(null);
        }
      });
      unsub = () => { try { data.subscription.unsubscribe(); } catch (e) {} };
    })();
    return () => { alive = false; unsub(); };
  }, []);
  const [progressTick, setProgressTick] = useState(0);
  const persistCart = (next) => {setCart(next);localStorage.setItem('conlatCart', JSON.stringify(next));};
  const bumpFilled = (name, qty) => {
    bumpGroupFilled(name, qty);
    setProgressTick((t) => t + 1);
  };
  const addToCart = (product, qty) => {
    const q = Math.max(1, qty || 1);
    const priceN = product.priceN != null ? product.priceN : parsePrecioAR(product.price);
    const oldN = product.oldN != null ? product.oldN : parsePrecioAR(product.old);
    const unit = product.unit || '/kg';
    const name = product.name || product.product;
    const existing = cart.find((c) => c.name === name);
    let next;
    if (existing) {
      next = cart.map((c) => c.name === name ? {
        ...c,
        qty: (c.qty || 1) + q,
        priceN: priceN || c.priceN,
        oldN: oldN || c.oldN,
        price: product.price || c.price || fmtPrecioAR(priceN || c.priceN || 0),
        old: product.old || c.old || (oldN ? fmtPrecioAR(oldN) : c.old),
      } : c);
    } else {
      next = [...cart, {
        id: name,
        name,
        price: product.price || fmtPrecioAR(priceN),
        old: product.old || (oldN ? fmtPrecioAR(oldN) : null),
        priceN,
        oldN,
        unit,
        qty: q,
        img: product.img,
        members: product.members || '?',
        progress: product.progress != null ? product.progress : (product.prog || 0),
        location: product.location || 'Palermo',
        joinedAt: Date.now(),
      }];
    }
    persistCart(next);
  };
  const updateCartQty = (id, qty) => {
    const q = Math.max(1, qty || 1);
    persistCart(cart.map((c) => c.id === id || c.name === id ? { ...c, qty: q } : c));
  };
  const removeFromCart = (id) => persistCart(cart.filter((c) => c.id !== id && c.name !== id));

  const showToast = (msg, ms) => {
    setToast(msg);
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => setToast(null), typeof ms === 'number' ? ms : 2400);
  };

  const confirmCartAsOrders = (opts) => {
    if (!cart.length) {
      showToast('No hay productos en el carrito');
      return;
    }
    const status = (opts && opts.status) || 'pagado';
    const prev = loadHubadorOrders();
    const next = mergeCartIntoOrders(prev, cart, user, { status });
    saveHubadorOrders(next);
    setOrders(next);
    const stampFloor = Date.now() - 5000;
    const touched = next.filter((o) => (o.status || '') === status && (o.confirmedAt || o.createdAt || 0) >= stampFloor);
    maybeInsertOrdersRemote(touched);
    persistCart([]);
    setMpDemoOpen(false);
    setProfileGateOpen(false);
    setMisGruposTab('activos');
    setActive('mis-grupos');
    try { window.__hubadorActive = 'mis-grupos'; } catch (e) {}
    try { localStorage.setItem('mobileScreen', 'mis-grupos'); } catch (e) {}
    setToast(null);
    clearTimeout(showToast._t);
    showToast((opts && opts.toast) || 'Pago demo aprobado · pedido en Grupos activos', 2800);
  };

  const startMpDemoPay = () => {
    if (!cart.length) {
      showToast('No hay productos en el carrito');
      return;
    }
    if (!user) {
      showToast('Ingresá para pagar');
      setScreen('login');
      return;
    }
    const contact = resolveUserContact(user);
    if (!contact.tel || !contact.direccion) {
      setProfileGateOpen(true);
      return;
    }
    setMpDemoOpen(true);
  };

  const saveContactAndContinuePay = async (tel, direccion) => {
    const t = String(tel || '').trim();
    const d = String(direccion || '').trim();
    if (!t || !d) {
      showToast('Completá teléfono y dirección');
      return;
    }
    saveHubadorProfileExtra({ tel: t, direccion: d });
    const nextUser = Object.assign({}, user || {}, { tel: t, direccion: d });
    applyUser(nextUser);
    if (sb && nextUser.id) {
      try {
        await upsertProfile(nextUser.id, {
          email: nextUser.email || null,
          nombre: nextUser.nombre || null,
          barrio: nextUser.barrio || null,
          tel: t,
          direccion: d,
        });
      } catch (e) { /* localStorage alcanza para la demo */ }
    }
    setProfileGateOpen(false);
    setMpDemoOpen(true);
  };

  const setScreen = (id) => {
    // En app pública no abrir Comparador/Precios ni Grupo en vivo legacy (solo ?dev / ?both)
    if (APP_MODE && id === 'comparador') id = 'home';
    if (APP_MODE && id === 'grupo-participantes') id = 'mis-grupos';
    // Historial / pedidos → Perfil (lista de estados embebida ahí)
    if (id === 'historial' || id === 'pedidos') id = 'perfil';
    if (id === 'productos') {
      const p = hubadorBestGancho();
      if (p) {
        setSelected(p);
        setSelectedGroup(grupoFromHubadorProduct(p, user?.barrio));
        setActive('grupo-detalle');
        try { window.__hubadorActive = 'grupo-detalle'; } catch (e) {}
        localStorage.setItem('mobileScreen', 'grupo-detalle');
        return;
      }
    }
    setActive(id);
    try { window.__hubadorActive = id; } catch (e) {}
    localStorage.setItem('mobileScreen', id);
  };

  const ScreenComp = SCREEN_COMPONENTS[active] || MobileHome;
  const screen = SCREENS.find((s) => s.id === active);

  const appInner = (
    <NavContext.Provider value={setScreen}>
      <SelectionContext.Provider value={{ selected, setSelected, selectedOrder, setSelectedOrder, selectedGroup, setSelectedGroup, showToast, user, login, logout, cart, addToCart, updateCartQty, removeFromCart, confirmCartAsOrders, startMpDemoPay, orders, misGruposTab, setMisGruposTab, webSearch, setWebSearch, bumpFilled, progressTick }}>
        <div style={{ flex: 1, minHeight: 0, display: 'flex', flexDirection: 'column', overflow: 'auto' }}>
          <ScreenComp />
        </div>
        {!['login', 'signup', 'admin', 'admin-grupos', 'admin-productos'].includes(active) &&
        <BottomNav active={active} />
        }
      </SelectionContext.Provider>
    </NavContext.Provider>
  );

  const toastEl = toast &&
    <div style={{ position: 'absolute', left: 16, right: 16, bottom: 30, background: 'rgba(20,20,20,0.94)', color: '#fff', borderRadius: 12, padding: '13px 16px', fontFamily: "'Inter',sans-serif", fontSize: 13.5, fontWeight: 500, display: 'flex', alignItems: 'center', gap: 10, boxShadow: '0 8px 24px rgba(0,0,0,0.25)', animation: 'slideUp 0.25s ease', zIndex: 50 }}>
      <span style={{ width: 22, height: 22, borderRadius: '50%', background: 'oklch(0.65 0.2 145)', color: '#fff', display: 'grid', placeItems: 'center', fontSize: 13, fontWeight: 800, flexShrink: 0 }}>✓</span>
      <span style={{ flex: 1 }}>{toast}</span>
    </div>;

  const gateContact = resolveUserContact(user);
  const checkoutOverlays = (
    <>
      <HubadorProfileGateModal
        open={profileGateOpen}
        initialTel={gateContact.tel}
        initialDireccion={gateContact.direccion}
        onCancel={() => setProfileGateOpen(false)}
        onSave={saveContactAndContinuePay}
      />
      <HubadorMpDemoModal
        open={mpDemoOpen}
        totalLabel={fmtPrecioAR(cartTotals(cart).grupo)}
        onCancel={() => setMpDemoOpen(false)}
        onApprove={() => confirmCartAsOrders({ status: 'pagado', toast: 'Pago demo aprobado · pedido en Grupos activos' })}
      />
    </>
  );

  const isDesktop = useIsDesktop();
  try { window.__hubadorActive = active; } catch (e) {}

  const selectionValue = { selected, setSelected, selectedOrder, setSelectedOrder, selectedGroup, setSelectedGroup, showToast, user, login, logout, cart, addToCart, updateCartQty, removeFromCart, confirmCartAsOrders, startMpDemoPay, orders, misGruposTab, setMisGruposTab, webSearch, setWebSearch, bumpFilled, progressTick };

  // ── Comparador Web + Mobile (estado compartido, misma pantalla activa) ──
  if (BOTH_MODE) {
    const WebComp = WEB_SCREEN_COMPONENTS[active] || WebHome;
    return (
      <NavContext.Provider value={setScreen}>
        <SelectionContext.Provider value={selectionValue}>
          <div className="stage stage-compare">
            <div className="top-bar">
              <div>
                <div className="brand">HUBADOR <span>Comparador Web · Mobile</span></div>
                <div className="sub">
                  Misma pantalla y carrito en ambos lados · <a href="?dev" style={{ color: 'oklch(0.75 0.12 165)' }}>Solo mobile (?dev)</a>
                  {' · '}
                  <a href="./" style={{ color: 'oklch(0.75 0.12 165)' }}>App pública</a>
                  {user && <span style={{ marginLeft: 8, color: 'oklch(0.75 0.15 165)' }}>· 👤 {user.nombre} ({cartTotals(cart).items} ítems)</span>}
                </div>
              </div>
              <div style={{ marginLeft: 'auto', display: 'flex', gap: 8, alignItems: 'center' }}>
              <button type="button" onClick={hubadorConnectSupabaseDev} style={{ background: 'transparent', border: '1px solid #3d6b64', color: 'oklch(0.75 0.12 165)', borderRadius: 6, padding: '6px 10px', fontSize: 11, fontFamily: 'inherit', cursor: 'pointer' }}>{sb ? 'Supabase ✓' : 'Conectar Supabase'}</button>
              {user && <button onClick={logout} style={{ background: 'transparent', border: '1px solid #555', color: '#aaa', borderRadius: 6, padding: '6px 10px', fontSize: 11, fontFamily: 'inherit', cursor: 'pointer' }}>Cerrar sesión</button>}
            </div>
            </div>
            <div className="screen-nav-groups">
              {[
              { key: 'auth', title: '🔐 Entrada', color: '#888' },
              { key: 'cliente', title: '👥 Cliente', color: 'oklch(0.65 0.18 165)' },
              { key: 'dev', title: '🔧 Ocultos', color: '#999' },
              { key: 'admin', title: '🛠️ Admin', color: 'oklch(0.70 0.15 50)' }].
              map((g) =>
              <div key={g.key} className="screen-nav-group">
                  <div className="screen-nav-group-title" style={{ color: g.color }}>{g.title}</div>
                  <div className="screen-nav-buttons">
                    {SCREENS.filter((s) => s.group === g.key).map((s) =>
                  <button key={s.id} className={active === s.id ? 'active' : ''} onClick={() => setScreen(s.id)}>
                        {s.label}
                      </button>
                  )}
                  </div>
                </div>
              )}
            </div>
            <div className="devices-row compare-row">
              <div className="compare-web-wrap">
                <div className="device-label">Web · {screen?.label}</div>
                <div className="compare-web-pane">
                  <div className="web-root">
                    <WebComp />
                  </div>
                </div>
              </div>
              <div className="device-wrap">
                <div className="device-label">Mobile · {screen?.label}</div>
                <IOSDevice width={390} height={844} dark={false}>
                  <div style={{ flex: 1, minHeight: 0, boxSizing: 'border-box', paddingTop: 62, display: 'flex', flexDirection: 'column', position: 'relative' }}>
                    {appInner}
                    {toastEl}
                  </div>
                </IOSDevice>
              </div>
            </div>
            {toast && (
              <div className="web-toast" style={{ position: 'fixed' }}>
                <span>✓</span>{toast}
              </div>
            )}
            {checkoutOverlays}
          </div>
        </SelectionContext.Provider>
      </NavContext.Provider>
    );
  }

  // ── Público: WEB completa en escritorio · MOBILE intacto en celular ──
  if (APP_MODE) {
    if (isDesktop) {
      const WebComp = WEB_SCREEN_COMPONENTS[active] || WebHome;
      return (
        <NavContext.Provider value={setScreen}>
          <SelectionContext.Provider value={selectionValue}>
            <div className="web-root">
              <WebComp />
              {toast && (
                <div className="web-toast">
                  <span>✓</span>{toast}
                </div>
              )}
              {checkoutOverlays}
            </div>
          </SelectionContext.Provider>
        </NavContext.Provider>
      );
    }
    return (
      <div className="app-shell app-shell-mobile">
        <div className="app-fullscreen">
          <div style={{ flex: 1, minHeight: 0, boxSizing: 'border-box', paddingTop: 'env(safe-area-inset-top, 0px)', display: 'flex', flexDirection: 'column', position: 'relative' }}>
            {appInner}
            {toastEl}
            {checkoutOverlays}
          </div>
        </div>
      </div>);
  }

  return (
    <div className="stage">
      <div className="top-bar">
        <div>
          <div className="brand">HUBADOR <span>Mobile</span></div>
          <div className="sub">Vista previa en iPhone 15 Pro · <a href="?both" style={{ color: 'oklch(0.75 0.12 165)' }}>Comparar Web + Mobile</a> {user && <span style={{ marginLeft: 8, color: 'oklch(0.75 0.15 165)' }}>· 👤 {user.nombre} ({cartTotals(cart).items} en formación)</span>}</div>
        </div>
        <div style={{ marginLeft: 'auto', display: 'flex', gap: 8, alignItems: 'center' }}>
              <button type="button" onClick={hubadorConnectSupabaseDev} style={{ background: 'transparent', border: '1px solid #3d6b64', color: 'oklch(0.75 0.12 165)', borderRadius: 6, padding: '6px 10px', fontSize: 11, fontFamily: 'inherit', cursor: 'pointer' }}>{sb ? 'Supabase ✓' : 'Conectar Supabase'}</button>
              {user && <button onClick={logout} style={{ background: 'transparent', border: '1px solid #555', color: '#aaa', borderRadius: 6, padding: '6px 10px', fontSize: 11, fontFamily: 'inherit', cursor: 'pointer' }}>Cerrar sesión</button>}
            </div>
      </div>
      <div className="screen-nav-groups">
        {[
        { key: 'auth', title: '🔐 Entrada', color: '#888' },
        { key: 'cliente', title: '👥 Cliente', color: 'oklch(0.65 0.18 165)' },
        { key: 'dev', title: '🔧 Ocultos', color: '#999' },
        { key: 'admin', title: '🛠️ Admin', color: 'oklch(0.70 0.15 50)' }].
        map((g) =>
        <div key={g.key} className="screen-nav-group">
            <div className="screen-nav-group-title" style={{ color: g.color }}>{g.title}</div>
            <div className="screen-nav-buttons">
              {SCREENS.filter((s) => s.group === g.key).map((s) =>
            <button key={s.id} className={active === s.id ? 'active' : ''} onClick={() => setScreen(s.id)}>
                  {s.label}
                </button>
            )}
            </div>
          </div>
        )}
      </div>
      <div className="devices-row">
        <div className="device-wrap">
          <div className="device-label">{screen?.label}</div>
          <IOSDevice width={390} height={844} dark={false}>
            <div style={{ flex: 1, minHeight: 0, boxSizing: 'border-box', paddingTop: 62, display: 'flex', flexDirection: 'column', position: 'relative' }}>
              {appInner}
              {toastEl}
            </div>
          </IOSDevice>
        </div>
      </div>
      {checkoutOverlays}
    </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
