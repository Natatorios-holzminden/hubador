<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HUBADOR — Marketplace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script type="text/babel">

// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports: IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,
      }}>{title}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  title, keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar (absolute) */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* nav + content */}
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        {title !== undefined && <IOSNavBar title={title} dark={dark} />}
        <div style={{ flex: 1, overflow: 'hidden', minHeight: 0, display: 'flex', flexDirection: 'column' }}>{children}</div>
        {keyboard && <IOSKeyboard dark={dark} />}
      </div>
      {/* home indicator — always on top */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
        }} />
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,
});

</script>

<script type="text/babel">

const { useState } = React;

// 💰 Markup de HUBADOR sobre el valor de compra (costo) del producto
const MARKUP = 0.30;
const markupOf = (cost) => Math.round(cost * MARKUP);

// ⏱ Cronómetro de urgencia — deadline persistente por producto (48–72h)
function getDeadline(key, hours) {
  const storeKey = 'conlat_deadline_' + key;
  let v = null;
  try { v = localStorage.getItem(storeKey); } catch (e) {}
  let ts = v ? parseInt(v, 10) : NaN;
  // Reiniciar si no existe, ya venció, o quedó por encima del máximo configurado (p. ej. caché vieja)
  if (!ts || isNaN(ts) || ts < Date.now() || ts > Date.now() + hours * 3600 * 1000 + 1000) {
    ts = Date.now() + hours * 3600 * 1000;
    try { localStorage.setItem(storeKey, String(ts)); } catch (e) {}
  }
  return ts;
}

function Countdown({ deadline, big, card, inline }) {
  const [now, setNow] = React.useState(Date.now());
  React.useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(id);
  }, []);
  let diff = Math.max(0, deadline - now);
  const totalSec = Math.floor(diff / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const pad = (n) => String(n).padStart(2, '0');
  const urgent = h < 12; // menos de 12h restantes = rojo
  const urgentColor = 'oklch(0.6 0.2 28)';
  const accent = urgent ? urgentColor : 'oklch(0.55 0.15 165)';

  // Bloque H/M/S con etiqueta — se ve el tiempo pasar
  const Seg = ({ v, lbl, size }) => (
    <span style={{ display: 'inline-flex', flexDirection: 'column', alignItems: 'center', lineHeight: 1 }}>
      <span style={{ fontVariantNumeric: 'tabular-nums', fontWeight: 800, fontSize: size, letterSpacing: '0.01em', color: accent }}>{pad(v)}</span>
      <span style={{ fontSize: size <= 16 ? 8 : 9, fontWeight: 600, color: '#9aa0a6', letterSpacing: '0.04em', marginTop: 2 }}>{lbl}</span>
    </span>);
  const Sep = ({ size }) => <span style={{ fontWeight: 800, fontSize: size, color: '#c8ccd0', alignSelf: 'flex-start', lineHeight: 1 }}>:</span>;

  if (inline) {
    return (
      <div style={{ display: 'inline-flex', alignItems: 'center', gap: 4, background: urgent ? 'oklch(0.97 0.03 28)' : '#f4f6f5', border: `1px solid ${urgent ? 'oklch(0.86 0.08 28)' : '#e3e7e5'}`, borderRadius: 7, padding: '2px 6px', flexShrink: 0 }}>

// Preview con menú: agregá ?dev=1
// Compatibilidad con versión vieja subida: ?app=1 también fuerza modo app.
const _qs = new URLSearchParams(location.search);
const DEV_MODE = _qs.has('dev'); // menú + iPhone preview
const FORCE_MOBILE = _qs.has('mobile'); // forzar UI mobile en desktop
const FORCE_WEB = _qs.has('web'); // forzar UI web
const APP_MODE = !DEV_MODE; // modo público (sin menú dev)
function isDesktopWidth() {
  return window.matchMedia('(min-width: 900px)').matches;
}
function useIsDesktop() {
  const [desk, setDesk] = React.useState(() => {
    if (FORCE_MOBILE) return false;
    if (FORCE_WEB) return true;
    return isDesktopWidth();
  });
  React.useEffect(() => {
    if (FORCE_MOBILE || FORCE_WEB) return;
    const mq = window.matchMedia('(min-width: 900px)');
    const fn = () => setDesk(mq.matches);
    mq.addEventListener?.('change', fn);
    mq.addListener?.(fn);
    return () => { mq.removeEventListener?.('change', fn); mq.removeListener?.(fn); };
  }, []);
  return desk;
}
if (APP_MODE) {
  try { document.documentElement.classList.add('app-mode'); } catch (e) {}
}

function MasOfertas({ excludeName, barrio = 'Palermo' }) {
  const primary = 'oklch(0.55 0.15 165)';
  const danger = 'oklch(0.62 0.18 35)';
  const navigate = React.useContext(NavContext);
  const { setSelected, showToast, addToCart, user } = React.useContext(SelectionContext);

  const baseOffers = React.useMemo(() => [
  { id: 'mo-papa', name: 'Papa', price: 1364, old: 2099, filled: 40, total: 54, deadlineHrs: 35, img: 'img/papa.jpg?v=20260730b' },
  { id: 'mo-cebo', name: 'Cebolla', price: 1105, old: 1700, filled: 27, total: 45, deadlineHrs: 40, img: 'img/cebolla-ok-20260730c.jpg' },
  { id: 'mo-nar', name: 'Naranja', price: 649, old: 999, filled: 49, total: 54, deadlineHrs: 32, img: 'img/naranja.jpg?v=20260730b' },
  { id: 'mo-bata', name: 'Batata', price: 1104, old: 1699, filled: 28, total: 36, deadlineHrs: 43, img: 'img/batata.jpg?v=20260730b' }].
  filter((o) => o.name !== excludeName), [excludeName]);

  const [offers, setOffers] = React.useState(baseOffers);
  React.useEffect(() => setOffers(baseOffers), [baseOffers]);

  const [qtys, setQtys] = React.useState(() => Object.fromEntries(offers.map((o) => [o.id, Math.min(2, Math.max(1, o.total - o.filled))])));
  const setQ = (id, v, max) => setQtys((q) => ({ ...q, [id]: Math.max(1, Math.min(max, v)) }));

  const join = (o) => {
    if (!user) {showToast('Iniciá sesión para sumarte al grupo');setTimeout(() => navigate('login'), 700);return;}
    const missing = Math.max(0, o.total - o.filled);
    const q = Math.min(qtys[o.id] || 1, missing);
    if (q <= 0) return;
    addToCart({ name: o.name, price: `$${o.price}`, unit: '/kg', img: o.img, members: `${o.filled + q}/${o.total}`, progress: Math.round((o.filled + q) / o.total * 100), location: barrio }, q);
    showToast(`Sumaste ${q} kg de ${o.name}`);
    // mover la barra en vivo
    setOffers((os) => os.map((x) => x.id === o.id ? { ...x, filled: Math.min(x.total, x.filled + q) } : x));
    setQtys((qs) => ({ ...qs, [o.id]: 1 }));
  };

  return (
    <div style={{ background: '#fff', border: '1px solid #e8eaec', borderRadius: 16, padding: '14px 14px 12px', marginTop: 16 }}>
      {/* Header */}
      <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 8, marginBottom: 2 }}>
        <div style={{ minWidth: 0 }}>
          <div style={{ fontSize: 10.5, color: '#888', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.06em' }}>Pedido de esta semana · cierra viernes 14hs</div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 4 }}>
            <span style={{ fontSize: 15, fontWeight: 800, letterSpacing: '-0.01em', color: '#1a1a1a' }}>Sumá más al pedido</span>
          </div>
          <div style={{ fontSize: 12, color: '#666', marginTop: 2 }}>📍 {barrio} · aprovechá el envío</div>
        </div>
        <div style={{ flexShrink: 0, display: 'inline-flex', alignItems: 'center', gap: 4, background: 'oklch(0.96 0.03 165)', color: primary, borderRadius: 999, padding: '4px 9px', fontSize: 10.5, fontWeight: 700 }}>
          <span style={{ width: 6, height: 6, borderRadius: '50%', background: primary, animation: 'pulse 1.6s infinite' }} />
          {offers.length} abiertos
        </div>
      </div>

      {/* Cards */}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginTop: 12 }}>
        {offers.map((o) => {
          const pct = Math.min(100, Math.round(o.filled / o.total * 100));
          const missing = Math.max(0, o.total - o.filled);
          const almost = missing <= 6;
          const isFull = missing === 0;
          const disc = Math.round((1 - o.price / o.old) * 100);
          const accent = isFull ? '#888' : almost ? danger : primary;
          const accentBg = isFull ? '#f0f0f0' : almost ? 'oklch(0.96 0.04 35)' : 'oklch(0.96 0.03 165)';
          const q = Math.min(qtys[o.id] || 1, Math.max(1, missing));
          return (
            <div key={o.id} style={{ background: '#fafbfc', border: '1px solid #ececef', borderRadius: 13, padding: '10px', display: 'flex', gap: 10 }}>
              <button onClick={() => {setSelected({ name: o.name, price: `$${o.price}`, unit: '/kg', old: `$${o.old}`, members: `${o.filled}/${o.total}`, prog: pct, time: '2d', disc, img: o.img });navigate('producto');}} style={{ width: 56, height: 56, borderRadius: 10, overflow: 'hidden', flexShrink: 0, background: '#fff', border: '1px solid #e8eaec', padding: 0, cursor: 'pointer' }}>
                <img src={o.img} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
              </button>

              <div style={{ flex: 1, minWidth: 0 }}>
                {/* Title row */}
                <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 8 }}>
                  <div style={{ minWidth: 0 }}>
                    <div style={{ fontWeight: 700, fontSize: 14, color: '#1a1a1a', lineHeight: 1.2 }}>{o.name}</div>
                    <div style={{ display: 'flex', alignItems: 'baseline', gap: 6, marginTop: 2 }}>
                      <span style={{ color: accent, fontWeight: 800, fontSize: 14 }}>${o.price}<span style={{ fontWeight: 500, fontSize: 11 }}>/kg</span></span>
                      <span style={{ fontSize: 11, color: '#aaa', textDecoration: 'line-through' }}>${o.old}</span>
                    </div>
                  </div>
                  <span style={{ flexShrink: 0, background: accentBg, color: accent, borderRadius: 999, padding: '2px 7px', fontSize: 10, fontWeight: 700, lineHeight: 1.4 }}>
                    {almost ? '⚡ Casi lleno' : `-${disc}%`}
                  </span>
                </div>

                {/* Timer + Progress */}
                {!isFull && <div style={{ marginTop: 8 }}><Countdown deadline={getDeadline(o.name, o.deadlineHrs || 40)} card /></div>}
                <div style={{ marginTop: 8 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 10.5, marginBottom: 3 }}>
                    <span style={{ color: almost ? accent : '#666', fontWeight: almost ? 700 : 500 }}>
                      {almost ? `¡Sólo faltan ${missing} kg!` : <>Faltan <b style={{ color: '#333' }}>{missing} kg</b> · mín. {o.total} kg</>}
                    </span>
                    <span style={{ color: '#888', fontVariantNumeric: 'tabular-nums' }}>{o.filled}/{o.total}</span>
                  </div>
                  <div style={{ height: 5, background: '#ececef', borderRadius: 999, overflow: 'hidden' }}>
                    <div style={{ height: '100%', width: `${pct}%`, background: accent, borderRadius: 999, transition: 'width 0.3s' }} />
                  </div>
                </div>

                {/* Actions */}
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: 9, gap: 8 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6, background: isFull ? '#f5f5f5' : '#fff', border: '1px solid #e2e4e8', borderRadius: 999, padding: '2px 4px', opacity: isFull ? 0.5 : 1 }}>
                    <button disabled={isFull || q <= 1} onClick={() => setQ(o.id, q - 1, missing)} style={{ width: 22, height: 22, borderRadius: 999, border: 'none', background: 'transparent', fontWeight: 700, fontSize: 14, cursor: isFull || q <= 1 ? 'not-allowed' : 'pointer', color: '#555', fontFamily: 'inherit', display: 'grid', placeItems: 'center', opacity: q <= 1 ? 0.35 : 1 }}>−</button>
                    <span style={{ fontWeight: 800, fontSize: 13, minWidth: 14, textAlign: 'center' }}>{isFull ? 0 : q}</span>
                    <button disabled={isFull || q >= missing} onClick={() => setQ(o.id, q + 1, missing)} style={{ width: 22, height: 22, borderRadius: 999, border: 'none', background: 'transparent', fontWeight: 700, fontSize: 14, cursor: isFull || q >= missing ? 'not-allowed' : 'pointer', color: '#555', fontFamily: 'inherit', display: 'grid', placeItems: 'center', opacity: q >= missing ? 0.35 : 1 }}>+</button>
                    <span style={{ fontSize: 11, color: '#888', padding: '0 6px 0 2px' }}>kg · <b style={{ color: accent }}>${(o.price * (isFull ? 0 : q)).toLocaleString('es-AR')}</b></span>
                  </div>
                  <button disabled={isFull} onClick={() => join(o)} style={{ background: accent, color: '#fff', border: 'none', borderRadius: 999, padding: '7px 12px', fontWeight: 700, fontSize: 12, cursor: isFull ? 'not-allowed' : 'pointer', fontFamily: 'inherit', whiteSpace: 'nowrap', display: 'inline-flex', alignItems: 'center', gap: 3, opacity: isFull ? 0.6 : 1 }}>
                    {isFull ? 'Completo' : '+ Unirme'}
                  </button>
                </div>
              </div>
            </div>);

        })}
      </div>

      <button onClick={() => navigate('productos')} style={{ width: '100%', marginTop: 10, background: 'transparent', border: 'none', color: primary, fontSize: 12.5, fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit', padding: '8px' }}>Ver todas las ofertas abiertas →</button>
    </div>);

}

function MobileMisGrupos() {
  const primary = 'oklch(0.55 0.15 165)';

  const { cart, user, setSelectedGroup, setSelectedOrder } = React.useContext(SelectionContext);

  if (!user) {
    return (
      <div style={{ fontFamily: "'Inter',sans-serif", background: '#f4f5f7', minHeight: '100%', display: 'grid', placeItems: 'center', padding: 30 }}>

        </div>
      </div>);

  }

  // Cada item del carrito = un grupo al que se unió
  const grupos = cart.map((c) => {
    const [m, t] = (c.members || '?/?').split('/').map((n) => parseInt(n, 10) || 0);
    return { ...c, m, t, status: m >= t ? 'cerrando' : 'formando' };
  });

  const totalGastos = cart.reduce((acc, c) => {
    const pn = parseInt((c.price || '$0').replace(/[^\d]/g, ''), 10) || 0;
    const line = pn * c.qty;
    return acc + line + markupOf(line);
  }, 0);

  const cerrando = grupos.filter((g) => g.status === 'cerrando').length;
  const formando = grupos.filter((g) => g.status === 'formando').length;

  return (
    <div style={{ fontFamily: "'Inter', sans-serif", background: '#f4f5f7', minHeight: '100%', WebkitFontSmoothing: 'antialiased' }}>

          <span style={{ fontWeight: 800, fontSize: 16 }}>Mis Grupos</span>
        </div>
        <div style={{ fontSize: 11.5, color: '#888' }}>👤 {user.nombre}</div>
      </header>

      {/* KPIs estilo dashboard, pero del cliente */}
      <div style={{ padding: '16px 16px 0' }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8, marginBottom: 14 }}>
          <div style={{ background: '#fff', border: '1px solid #e8eaec', borderRadius: 11, padding: '10px 12px' }}>
            <div style={{ fontSize: 10.5, color: '#888', fontWeight: 500, marginBottom: 3 }}>Grupos</div>
            <div style={{ fontWeight: 800, fontSize: 20 }}>{grupos.length}</div>
          </div>
          <div style={{ background: '#fff', border: '1px solid #e8eaec', borderRadius: 11, padding: '10px 12px' }}>
            <div style={{ fontSize: 10.5, color: '#888', fontWeight: 500, marginBottom: 3 }}>Formándose</div>
            <div style={{ fontWeight: 800, fontSize: 20, color: 'oklch(0.55 0.15 55)' }}>{formando}</div>
          </div>
          <div style={{ background: '#fff', border: '1px solid #e8eaec', borderRadius: 11, padding: '10px 12px' }}>
            <div style={{ fontSize: 10.5, color: '#888', fontWeight: 500, marginBottom: 3 }}>A pagar</div>
            <div style={{ fontWeight: 800, fontSize: 16, color: primary }}>${totalGastos.toLocaleString('es-AR')}</div>
            <div style={{ fontSize: 9, color: '#aaa', marginTop: 1 }}>incl. 30%</div>
          </div>
        </div>
      </div>

      <div style={{ padding: '0 16px 24px' }}>
        <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 10, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <span>Grupos activos</span>
          <span style={{ fontSize: 11.5, color: '#888', fontWeight: 500 }}>{grupos.length} {grupos.length === 1 ? 'grupo' : 'grupos'}</span>
        </div>

        {grupos.length === 0 ?
        <div style={{ background: '#fff', border: '1.5px dashed #d8dadc', borderRadius: 14, padding: '28px 16px', textAlign: 'center' }}>
            <div style={{ fontSize: 36, marginBottom: 8 }}>👥</div>
            <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 4 }}>Todavía no te uniste a ningún grupo</div>

            <button onClick={() => navigate('home')} style={{ background: primary, color: '#fff', border: 'none', borderRadius: 9, padding: '9px 18px', fontFamily: 'inherit', fontSize: 13, fontWeight: 600, cursor: 'pointer' }}>Explorar productos</button>
          </div> :

        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {grupos.map((g) => {
            const pn = parseInt((g.price || '$0').replace(/[^\d]/g, ''), 10) || 0;
            const ln = pn * g.qty + markupOf(pn * g.qty);
            const isClose = g.status === 'cerrando';
            return (
              <div key={g.id} onClick={() => {setSelectedGroup({ product: g.name, location: g.location, members: g.members, progress: g.progress, closes: '2d', price: g.price, unit: g.unit, img: g.img, status: 'abierto' });navigate('grupo-participantes');}} style={{ background: '#fff', border: '1px solid #e8eaec', borderRadius: 13, padding: 12, display: 'flex', gap: 12, cursor: 'pointer' }}>
                  <div style={{ width: 56, height: 56, borderRadius: 10, overflow: 'hidden', flexShrink: 0 }}>

                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 8 }}>
                      <div style={{ fontWeight: 700, fontSize: 14 }}>{g.name}</div>
                      <span style={{ flexShrink: 0, background: isClose ? '#dcfce7' : '#fef9c3', color: isClose ? '#166534' : '#854d0e', borderRadius: 999, padding: '2px 8px', fontSize: 10.5, fontWeight: 700 }}>{isClose ? '✓ Listo' : '🕒 Formando'}</span>
                    </div>
                    <div style={{ fontSize: 11.5, color: '#888', margin: '3px 0' }}>{g.qty} {g.unit === '/u' ? 'u' : 'kg'} · 👥 {g.members} · 📍 {g.location}</div>
                    <div style={{ height: 4, background: '#f0f1f3', borderRadius: 999, overflow: 'hidden', marginTop: 5 }}>
                      <div style={{ height: '100%', width: `${Math.min(100, g.m / g.t * 100 || 40)}%`, background: isClose ? 'oklch(0.65 0.2 145)' : primary, borderRadius: 999 }} />
                    </div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 5, fontSize: 11.5 }}>
                      <span style={{ color: '#888' }}>Mi pedido</span>
                      <span style={{ fontWeight: 700, color: primary }}>${ln.toLocaleString('es-AR')}</span>
                    </div>
                  </div>
                </div>);

          })}
            <button onClick={() => navigate('home')} style={{ background: 'transparent', border: `1.5px solid ${primary}`, color: primary, borderRadius: 10, padding: '10px', fontFamily: 'inherit', fontSize: 13, fontWeight: 600, cursor: 'pointer', marginTop: 4 }}>+ Unirme a otro grupo</button>
          </div>
        }

        {/* Link al historial de pedidos pasados */}
        <div onClick={() => navigate('historial')} style={{ marginTop: 18, background: '#fff', border: '1px solid #e8eaec', borderRadius: 12, padding: '14px 16px', display: 'flex', alignItems: 'center', gap: 12, cursor: 'pointer' }}>

            <div style={{ fontWeight: 600, fontSize: 13.5 }}>Historial de pedidos</div>
            <div style={{ fontSize: 11.5, color: '#888' }}>Pedidos entregados y pagados</div>
          </div>
          <span style={{ color: '#bbb', fontSize: 18 }}>›</span>
        </div>
      </div>
    </div>);

}

function WebGrupoDetalle() {
  const primary = 'oklch(0.55 0.15 165)';
  const STEP = 4;
  const [qty, setQty] = React.useState(STEP);
  const navigate = React.useContext(NavContext);
  const { selectedGroup, showToast, addToCart, user } = React.useContext(SelectionContext);
  const g = selectedGroup || { product: 'Papa', location: 'Palermo', members: '9/12', progress: 75, closes: '2d', deadlineHrs: 35, price: '$1.364', old: '$2.099', unit: '/kg', disc: 35, img: 'img/papa.jpg?v=20260730b' };
  const priceNum = parseInt((g.price || '$0').replace(/[^\d]/g, ''), 10) || 0;
  const totalPrice = priceNum * qty;
  const markupTotal = typeof markupOf === 'function' ? markupOf(totalPrice) : Math.round(totalPrice * 0.3);
  const grandTotal = totalPrice + markupTotal;
  const join = () => {
    if (!user) { showToast('Iniciá sesión para sumarte al grupo'); setTimeout(() => navigate('login'), 700); return; }
    addToCart({ name: g.product, price: g.price, unit: g.unit || '/kg', img: g.img, members: g.members, progress: g.progress, location: g.location }, qty);
    showToast('Pedido enviado: ' + qty + ' de ' + g.product);
    setTimeout(() => navigate('grupo-participantes'), 800);
  };
  const totalKg = g.totalKg || 50;
  const pct = g.progress != null ? g.progress : 75;
  const filledKg = Math.round(pct / 100 * totalKg);
  const missingKg = Math.max(0, totalKg - filledKg);
  return (
    <WebShell title="Detalle del grupo" wide>
      <div className="web-detail">
        <button type="button" className="web-back" onClick={() => navigate('home')}>← Volver</button>
        <div className="web-detail-grid">
          <div className="web-detail-media">
            <img src={g.img} alt={g.product} />
            {g.disc != null && <span className="web-badge">↓ {g.disc}%</span>}
          </div>
          <div className="web-detail-body">
            <div className="web-muted">Compra en conjunto · 📍 {g.location || 'CABA'}</div>
            <h1>{g.product}</h1>
            <div className="web-detail-prices">
              <div><s>{g.old}{g.unit}</s><em>Coto</em></div>
              <div><strong>{g.price}{g.unit}</strong><span>en grupo</span></div>
            </div>
            {g.deadlineHrs != null && typeof Countdown !== 'undefined' && <div className="web-countdown-wrap"><Countdown deadline={getDeadline(g.product, g.deadlineHrs)} card /></div>}
            <div className="web-progress"><i style={{ width: pct + '%', background: primary }} /></div>
            <div className="web-muted">Faltan {missingKg} kg · {filledKg}/{totalKg} kg</div>
            <div className="web-qty">
              <span>Cantidad ({g.unit === '/u' ? 'u' : 'kg'})</span>
              <div>
                <button type="button" onClick={() => setQty((q) => Math.max(STEP, q - STEP))}>−</button>
                <b>{qty}</b>
                <button type="button" onClick={() => setQty((q) => q + STEP)}>+</button>
              </div>
            </div>
            <div className="web-breakdown">
              <div><span>Valor de compra</span><span>{'$' + totalPrice.toLocaleString('es-AR')}</span></div>
              <div><span>Servicio HUBADOR (30%)</span><span>{'+$' + markupTotal.toLocaleString('es-AR')}</span></div>
              <div className="web-breakdown-total"><span>Total a pagar</span><strong>{'$' + grandTotal.toLocaleString('es-AR')}</strong></div>
            </div>
            <button type="button" className="web-btn" onClick={join}>Unirme al grupo</button>
          </div>
        </div>
      </div>
    </WebShell>
  );
}

  home: WebHome,
  productos: WebProductos,

  historial: WebHistorial,
  'mis-grupos': WebMisGrupos,
  comparador: WebComparador,
  perfil: WebPerfil,
  login: WebLogin,
  signup: WebSignup,
  admin: WebAdmin,
  'admin-grupos': WebAdminGrupos,
  'admin-productos': WebAdminProductos,
  'grupo-detalle': WebGrupoDetalle,
  'grupo-participantes': WebGrupoParticipantes,
  seguimiento: WebSeguimiento,
  mapa: WebMapa,
};

const SCREEN_COMPONENTS = {
  home: MobileHome,
  productos: MobileProductos,
  producto: MobileProducto,
  pedidos: MobilePedidos,
  historial: MobilePedidos,
  'mis-grupos': MobileMisGrupos,
  comparador: MobileComparador,
  perfil: MobilePerfil,
  login: MobileLogin,
  signup: MobileSignup,
  admin: MobileAdmin,
  'admin-grupos': MobileAdminGrupos,
  'admin-productos': MobileAdminProductos,
  'grupo-detalle': MobileGrupoDetalle,
  'grupo-participantes': MobileGrupoParticipantes,
  'seguimiento': MobileSeguimiento,
  'mapa': MobileMapa
};

function App() {
  const [active, setActive] = useState(() => localStorage.getItem('mobileScreen') || 'home');
  const [selected, setSelected] = useState(null);
  const [selectedOrder, setSelectedOrder] = useState(null);
  const [selectedGroup, setSelectedGroup] = useState(null);
  const [toast, setToast] = useState(null);
  const [user, setUser] = useState(() => {try {return JSON.parse(localStorage.getItem('conlatUser') || 'null');} catch (e) {return null;}});
  const login = (u) => {setUser(u);localStorage.setItem('conlatUser', JSON.stringify(u));};
  const logout = () => {setUser(null);localStorage.removeItem('conlatUser');localStorage.removeItem('conlatCart');setCart([]);};
  const [cart, setCart] = useState(() => {try {return JSON.parse(localStorage.getItem('conlatCart') || '[]');} catch (e) {return [];}});
  const persistCart = (next) => {setCart(next);localStorage.setItem('conlatCart', JSON.stringify(next));};
  const addToCart = (product, qty) => {
    const id = `${product.name}-${Date.now()}`;
    const next = [...cart, { id, name: product.name, price: product.price, unit: product.unit || '/kg', qty, img: product.img, members: product.members || '?', progress: product.progress || product.prog || 0, location: product.location || 'Palermo', joinedAt: Date.now() }];
    persistCart(next);
  };
  const removeFromCart = (id) => persistCart(cart.filter((c) => c.id !== id));

  const showToast = (msg) => {
    setToast(msg);
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => setToast(null), 2400);
  };

  const setScreen = (id) => {
    setActive(id);
    localStorage.setItem('mobileScreen', id);
  };

  const ScreenComp = SCREEN_COMPONENTS[active] || MobileHome;
  const screen = SCREENS.find((s) => s.id === active);

  const appInner = (
    <NavContext.Provider value={setScreen}>
      <SelectionContext.Provider value={{ selected, setSelected, selectedOrder, setSelectedOrder, selectedGroup, setSelectedGroup, showToast, user, login, logout, cart, addToCart, removeFromCart }}>
        <div style={{ flex: 1, minHeight: 0, display: 'flex', flexDirection: 'column', overflow: 'auto' }}>
          <ScreenComp />
        </div>
        {!['login', 'signup', 'admin', 'admin-grupos', 'admin-productos'].includes(active) &&
        <BottomNav active={active} />
        }
      </SelectionContext.Provider>
    </NavContext.Provider>
  );

  const toastEl = toast &&
    <div style={{ position: 'absolute', left: 16, right: 16, bottom: 30, background: 'rgba(20,20,20,0.94)', color: '#fff', borderRadius: 12, padding: '13px 16px', fontFamily: "'Inter',sans-serif", fontSize: 13.5, fontWeight: 500, display: 'flex', alignItems: 'center', gap: 10, boxShadow: '0 8px 24px rgba(0,0,0,0.25)', animation: 'slideUp 0.25s ease', zIndex: 50 }}>
      <span style={{ width: 22, height: 22, borderRadius: '50%', background: 'oklch(0.65 0.2 145)', color: '#fff', display: 'grid', placeItems: 'center', fontSize: 13, fontWeight: 800, flexShrink: 0 }}>✓</span>
      <span style={{ flex: 1 }}>{toast}</span>
    </div>;

  const isDesktop = useIsDesktop();

  // ── Público: WEB completa en escritorio · MOBILE intacto en celular ──
  if (APP_MODE) {
    if (isDesktop) {
      const WebComp = WEB_SCREEN_COMPONENTS[active] || WebHome;
      return (
        <NavContext.Provider value={setScreen}>
          <SelectionContext.Provider value={{ selected, setSelected, selectedOrder, setSelectedOrder, selectedGroup, setSelectedGroup, showToast, user, login, logout, cart, addToCart, removeFromCart }}>
            <div className="web-root">
              <WebComp />
              {toast && (
                <div className="web-toast">
                  <span>✓</span>{toast}
                </div>
              )}
            </div>
          </SelectionContext.Provider>
        </NavContext.Provider>
      );
    }
    return (
      <div className="app-shell app-shell-mobile">
        <div className="app-fullscreen">
          <div style={{ flex: 1, minHeight: 0, boxSizing: 'border-box', paddingTop: 'env(safe-area-inset-top, 0px)', display: 'flex', flexDirection: 'column', position: 'relative' }}>
            {appInner}
            {toastEl}
          </div>
        </div>
      </div>);
  }

  return (
    <div className="stage">
      <div className="top-bar">
        <div>
          <div className="brand">HUBADOR <span>Mobile</span></div>
          <div className="sub">Vista previa en iPhone 15 Pro {user && <span style={{ marginLeft: 8, color: 'oklch(0.75 0.15 165)' }}>· 👤 {user.nombre} ({cart.length} en formación)</span>}</div>
        </div>
        {user && <button onClick={logout} style={{ marginLeft: 'auto', background: 'transparent', border: '1px solid #555', color: '#aaa', borderRadius: 6, padding: '6px 10px', fontSize: 11, fontFamily: 'inherit', cursor: 'pointer' }}>Cerrar sesión</button>}
      </div>
      <div className="screen-nav-groups">
        {[
        { key: 'auth', title: '🔐 Entrada', color: '#888' },
        { key: 'cliente', title: '👥 Cliente', color: 'oklch(0.65 0.18 165)' },
        { key: 'admin', title: '🛠️ Admin', color: 'oklch(0.70 0.15 50)' }].
        map((g) =>
        <div key={g.key} className="screen-nav-group">
            <div className="screen-nav-group-title" style={{ color: g.color }}>{g.title}</div>
            <div className="screen-nav-buttons">
              {SCREENS.filter((s) => s.group === g.key).map((s) =>
            <button key={s.id} className={active === s.id ? 'active' : ''} onClick={() => setScreen(s.id)}>
                  {s.label}
                </button>
            )}
            </div>
          </div>
        )}
      </div>
      <div className="devices-row">
        <div className="device-wrap">
          <div className="device-label">{screen?.label}</div>
          <IOSDevice width={390} height={844} dark={false}>
            <div style={{ flex: 1, minHeight: 0, boxSizing: 'border-box', paddingTop: 62, display: 'flex', flexDirection: 'column', position: 'relative' }}>
              {appInner}
              {toastEl}
            </div>
          </IOSDevice>
        </div>
      </div>
    </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
