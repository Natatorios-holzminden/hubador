name: Build y publicar

# Solo se dispara cuando cambia src/index.html (el codigo fuente que se edita a mano).
# Asi el commit que este mismo workflow hace de vuelta (index.html + app.bundle.js generados)
# no se vuelve a disparar a si mismo.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compilar src/index.html -> index.html + app.bundle.js
        run: node scripts/build.js

      - name: Publicar cambios
        run: |
          git config user.name "hubador-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html app.bundle.js
          git diff --cached --quiet && echo "Sin cambios, nada que publicar" && exit 0
          git commit -m "build: compilar index.html desde src/ [skip build]"
          git push
